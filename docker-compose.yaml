services:
  frontend:
    build: ./frontend
    ports:
      # Nginx escuta na 80 dentro do contêiner
      - "3000:80"
    depends_on:
      - load-balancer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Balanceador (Nginx) na frente das réplicas da API. O frontend fala com a porta 4000.
  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "4000:80"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  api-gateway:
    build: ./api-gateway
    deploy:
      replicas: 2
    # Sem "ports": as réplicas só são acessadas pelo load-balancer
    environment:
      # A URL é montada dinamicamente com as variáveis seguras
      - DB_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      database:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build: ./worker
    deploy:
      replicas: 2
    environment:
      # Banco próprio do worker (history-db), separado do banco da API
      - DB_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@history-db:3306/historico
      - RABBITMQ_URL=${RABBITMQ_URL}
      - PROCESSING_DELAY_MS=100
    depends_on:
      history-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  message-broker:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Banco da API (tarefas)
  database:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      # Script de criação das tabelas (roda só quando o volume está vazio)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 força TCP: durante o init o servidor temporário não aceita TCP,
      # então só fica "healthy" depois que o init.sql terminou
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Banco do worker (histórico de eventos). O worker cria a tabela ao subir.
  history-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=historico
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - history-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Teste de carga. Não sobe no `docker compose up`; rodar com:
  #   docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    command: run /scripts/kanban.js
    volumes:
      - ./load-test:/scripts:ro
      - ./load-test/results:/results
    depends_on:
      - load-balancer

volumes:
  db-data:
  history-data:
