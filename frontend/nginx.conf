log_format json_web escape=json '{"ts":"$time_iso8601","level":"info","service":"frontend",'
    '"msg":"request","method":"$request_method","path":"$request_uri","status":$status,'
    '"durationSec":$request_time}';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /dev/stdout json_web;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
