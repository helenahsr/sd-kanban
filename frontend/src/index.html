<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Distribuído</title>
    <!-- Importando o Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-100 p-5 h-screen flex flex-col relative overflow-hidden">
    
    <!-- Header do Board -->
    <header class="mb-4">
        <h1 class="text-3xl font-bold text-gray-800 text-center">Meu Kanban</h1>
    </header>

    <!-- Board Container -->
    <div class="board flex-1 grid grid-cols-1 md:grid-cols-3 gap-5 w-full min-h-0">
        
        <!-- Coluna To Do -->
        <div class="column bg-gray-200 rounded-lg p-4 flex flex-col overflow-y-auto transition-colors duration-200" id="todo" data-status="todo">
            <h2 class="font-semibold text-lg mb-4 text-gray-700 uppercase tracking-wide shrink-0">To Do</h2>
        </div>

        <!-- Coluna Doing -->
        <div class="column bg-gray-200 rounded-lg p-4 flex flex-col overflow-y-auto transition-colors duration-200" id="doing" data-status="doing">
            <h2 class="font-semibold text-lg mb-4 text-gray-700 uppercase tracking-wide shrink-0">Doing</h2>
        </div>

        <!-- Coluna Done -->
        <div class="column bg-gray-200 rounded-lg p-4 flex flex-col overflow-y-auto transition-colors duration-200" id="done" data-status="done">
            <h2 class="font-semibold text-lg mb-4 text-gray-700 uppercase tracking-wide shrink-0">Done</h2>
        </div>
    </div>

    <!-- Botão Flutuante (FAB) -->
    <button id="addBtn" class="fixed bottom-8 right-8 bg-blue-600 hover:bg-blue-700 text-white rounded-full w-14 h-14 flex items-center justify-center text-3xl shadow-lg transition-transform hover:scale-110 active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-300 z-40" title="Adicionar nova tarefa">
        +
    </button>

    <!-- MODAL (USADO PARA CRIAR E EDITAR) -->
    <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl mx-4">
            <!-- Adicionado o ID modalTitle para trocar dinamicamente -->
            <h2 id="modalTitle" class="text-xl font-bold mb-5 text-gray-800">Nova Tarefa</h2>
            
            <form id="taskForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="taskName">Tarefa</label>
                    <input type="text" id="taskName" required placeholder="Ex: Configurar servidor" class="shadow-sm appearance-none border border-gray-300 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="taskStatus">Status</label>
                    <select id="taskStatus" class="shadow-sm border border-gray-300 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="todo">To Do</option>
                        <option value="doing">Doing</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="taskAssignee">Responsável</label>
                    <input type="text" id="taskAssignee" required placeholder="Ex: João" class="shadow-sm appearance-none border border-gray-300 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="taskCreator">Criador</label>
                    <!-- Classes disabled:* controlam o visual quando o input estiver bloqueado -->
                    <input type="text" id="taskCreator" required placeholder="Ex: Maria" class="shadow-sm appearance-none border border-gray-300 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 transition disabled:bg-gray-100 disabled:text-gray-400 disabled:border-gray-200 disabled:cursor-not-allowed">
                </div>
                
                <div class="flex justify-end gap-3">
                    <button type="button" id="closeModalBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-gray-400 transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-md">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
