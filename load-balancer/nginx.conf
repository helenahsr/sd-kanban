# Balanceador na frente das réplicas da API Gateway (round-robin).
# Incluído no bloco http do nginx.conf padrão da imagem.

# DNS interno do Docker. `resolve` + valid=2s: réplicas que sobem/caem entram e saem
# do balanceamento sem reiniciar o Nginx
resolver 127.0.0.11 valid=2s ipv6=off;

upstream api_gateway {
    zone api_gateway 64k;
    server api-gateway:4000 resolve max_fails=1 fail_timeout=5s;
}

# Repassa o correlation id do cliente ou gera um novo
map $http_x_correlation_id $correlation_id {
    ""      $request_id;
    default $http_x_correlation_id;
}

# Necessário para o upgrade HTTP -> WebSocket do Socket.io
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

log_format json_lb escape=json '{"ts":"$time_iso8601","level":"info","service":"load-balancer",'
    '"msg":"request","method":"$request_method","path":"$request_uri","status":$status,'
    '"durationSec":$request_time,"upstream":"$upstream_addr","correlationId":"$correlation_id"}';

server {
    listen 80;
    access_log /dev/stdout json_lb;

    location = /lb-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"load-balancer"}';
    }

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $correlation_id;

        # Timeouts: falha rápido ao conectar numa réplica morta. O read_timeout
        # é maior que o ping do Socket.io (25s) para não derrubar WebSockets ociosos.
        proxy_connect_timeout 1s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;

        # Se uma réplica cair, tenta a outra. Por padrão o Nginx NÃO repete
        # métodos não idempotentes (POST), evitando criar a tarefa duas vezes.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
